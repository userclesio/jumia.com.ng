<script>
function getDeliveryDate() {
  var d = new Date();
  d.setDate(d.getDate() + 3);
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

document.getElementById('deliveryForm').addEventListener('submit', function(e) {
  e.preventDefault();

  var name      = document.getElementById('recipientName').value;
  var phone     = document.getElementById('recipientMobile').value;
  var street    = document.getElementById('streetAddress').value;
  var area      = document.getElementById('area').value;
  var city      = document.getElementById('city').value;
  var state     = document.getElementById('state').value;

  var parts = [];
  if (street) parts.push(street);
  if (area)   parts.push(area);
  var line2 = [];
  if (city)  line2.push(city);
  if (state) line2.push(state);

  var addressHtml = parts.join(', ');
  if (line2.length) addressHtml += '<br>' + line2.join(', ');
  if (name)  addressHtml += '<br><strong>' + name + '</strong>';
  if (phone) addressHtml += ' &bull; ' + phone;

  document.getElementById('reviewAddress').innerHTML = addressHtml;
  document.getElementById('deliveryDate').textContent = 'Estimated Delivery: ' + getDeliveryDate();

  document.getElementById('formSection').style.display = 'none';
  document.getElementById('orderReview').style.display = 'block';
  window.scrollTo(0, 0);

  fbq('track', 'AddPaymentInfo');
});

document.getElementById('completeBtn').addEventListener('click', function() {
  fbq('track', 'Purchase', { value: 27999, currency: 'NGN' });
  fetch('/api/capi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ event_name: 'Purchase', event_source_url: window.location.href, client_user_agent: navigator.userAgent })
  });
  setTimeout(function() {
    window.location.href = 'https://zuckpay.com.br/checkout/teste-14';
  }, 300);
});
</script>
